<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORCA Voice Room</title><style>:root{color-scheme:dark}body{margin:0;background:#0b1020;color:#eef2ff;font:16px system-ui}main{max-width:760px;margin:auto;padding:22px}.card{background:#151d32;border:1px solid #29344e;border-radius:16px;padding:18px;margin:12px 0}button,select,textarea{font:inherit;padding:12px;border-radius:10px;background:#202b45;color:white;border:1px solid #43516d}button{cursor:pointer;margin:4px}.primary{background:#5268e8;border:0}textarea{width:100%;box-sizing:border-box;min-height:100px}.turn{border-left:3px solid #7185ff;padding:8px 12px;margin:10px 0}.muted{color:#aab7d2}</style></head><body><main><h1>ORCA <span style="color:#8397ff">Founder Voice Room</span></h1><p class="muted">Atlas · Astra · Nova · Miles</p><section class="card"><b>AI voice disclosure</b><p class="muted">AI-generated voices. This is not a native Google Meet participant.</p><button class="primary" id="mic">Start microphone</button><button id="stand">Run founder stand-up</button><p id="status">Ready</p></section><section class="card"><h3>Talk to an agent</h3><select id="who"><option value="miles">Miles · Host</option><option value="atlas">Atlas · Developer</option><option value="astra">Astra · Strategist</option><option value="nova">Nova · Researcher</option></select><textarea id="q" placeholder="Ask your agent…"></textarea><button class="primary" id="send">Send and speak</button></section><section class="card"><h3>Transcript</h3><div id="log"></div></section></main><script>const $=id=>document.getElementById(id);function status(s){$("status").textContent=s}function add(n,t){const d=document.createElement("div");d.className="turn";const b=document.createElement("b");b.textContent=n;const p=document.createElement("p");p.textContent=t;d.append(b,p);$("log").prepend(d)}async function speak(x){if(!x.audio_base64)return;const a=new Audio("data:audio/mp3;base64,"+x.audio_base64);await new Promise(r=>{a.onended=r;a.onerror=r;a.play().catch(r)})}async function ask(id,msg){status(id+" thinking…");const r=await fetch("/api/agent/"+id+"/respond",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,context:"ORCA companion; no live repo/deployment status was supplied to this page."})});const x=await r.json();if(!r.ok)throw Error(x.detail||"Request failed");add(x.name+" · "+x.role,x.text);status(x.name+" speaking");await speak(x);status("Ready")}$("send").onclick=async()=>{let q=$("q").value.trim();if(q)try{await ask($("who").value,q)}catch(e){status(e.message)}};$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status("Speech recognition unsupported here; type or use Chrome.");return}const rec=new SR();rec.lang="en-IN";rec.onresult=e=>{$("q").value=e.results[0][0].transcript;$("send").click()};rec.onerror=e=>status("Mic: "+e.error);rec.start();status("Listening…")};$("stand").onclick=async()=>{status("Miles is hosting");try{const r=await fetch("/api/standup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Founder stand-up",context:"ORCA companion with memory/routines; starter project now committed. Do not claim deployment or test status unless verified."})});const x=await r.json();if(!r.ok)throw Error(x.detail||"Stand-up failed");for(const t of x.turns){add(t.name+" · "+t.role,t.text);status(t.name+" speaking");await speak(t)}status("Stand-up complete")}catch(e){status(e.message)}};</script></body></html>
